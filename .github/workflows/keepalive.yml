name: Keep Render Service Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier sleep (sleeps after 15 mins)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Service
        # Replace the URL below with your actual Render URL
        run: |
          curl -f https://rayos-relay-backend.onrender.com/api/docs -o /dev/null -s || echo "Ping failed but workflow continues"
